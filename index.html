    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Vaali Stones",
        "url": "https://stones.vaaliadvisory.com",
        "logo": "https://stones.vaaliadvisory.com/logo-og.png",

        "description": "A curated showcase of natural stone materials for design and architecture."
      }
    </script>
  </head>
  <body>
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
